# Build llama-server (16 GB / sm_120) and push to GitHub Container Registry
#
# Triggers:
#   - push to master  -> ghcr.io/<owner>/llama-server-16gb:latest + :sha-<commit>
#   - tag b*|stable*  -> ghcr.io/<owner>/llama-server-16gb:<tag>
#   - manual dispatch -> custom llama.cpp ref / CUDA arch
#
# The CUDA arch is passed explicitly (default 120 = Blackwell / RTX 50-series)
# because CI runners have no GPU and would otherwise build only PTX.

name: Build llama-server 16GB

on:
  push:
    branches: [master]
    tags: ['b*', 'stable*']
  workflow_dispatch:
    inputs:
      llama_ref:
        description: 'LLAMA_REF (tag, branch, or commit)'
        required: false
        default: 'b12716'
      cuda_arch:
        description: 'CMAKE_CUDA_ARCHITECTURES (e.g. 120, 89;120)'
        required: false
        default: '120'
      build_jobs:
        description: 'Parallel build jobs'
        required: false
        default: '4'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/llama-server-16gb

jobs:
  build:
    runs-on: ${{ github.repository_owner == 'noxgle' && vars.SELF_HOSTED_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
          flavor: |
            latest=false

      - name: Determine build args
        id: args
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "llama_ref=${{ inputs.llama_ref }}" >> "$GITHUB_OUTPUT"
            echo "cuda_arch=${{ inputs.cuda_arch }}" >> "$GITHUB_OUTPUT"
            echo "build_jobs=${{ inputs.build_jobs }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            # stable tags embed the pinned llama.cpp b-tag, e.g. stable-b12716-v1
            if [[ "${{ github.ref_name }}" == stable* ]]; then
              stable_ref=$(printf '%s' "${{ github.ref_name }}" | grep -oE 'b[0-9]+' | head -1 || true)
              echo "llama_ref=${stable_ref:-master}" >> "$GITHUB_OUTPUT"
            else
              echo "llama_ref=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            fi
            echo "cuda_arch=120" >> "$GITHUB_OUTPUT"
            echo "build_jobs=4" >> "$GITHUB_OUTPUT"
          else
            echo "llama_ref=master" >> "$GITHUB_OUTPUT"
            echo "cuda_arch=120" >> "$GITHUB_OUTPUT"
            echo "build_jobs=4" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            LLAMA_REF=${{ steps.args.outputs.llama_ref }}
            GGML_CUDA_ARCH=${{ steps.args.outputs.cuda_arch }}
            BUILD_JOBS=${{ steps.args.outputs.build_jobs }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: ${{ vars.SELF_HOSTED_RUNNER != '' }}
