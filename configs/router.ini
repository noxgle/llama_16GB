; ═══════════════════════════════════════════════════════════════════
; ROUTER MODE PRESETS (experimental) — llama.cpp b12716
;
; Used with `llama-server --models-preset /router.ini` and NO -m flag.
; Start with --models-max 1 --models-memory-margin 512: the 16 GB card
; fits only one of these models at a time; the router unloads the LRU
; instance before loading another. See README → Router mode.
;
; Keys are CLI options without the leading dashes. Precedence:
; router CLI args > model-specific section > [*] global section.
; ═══════════════════════════════════════════════════════════════════

version = 1

[*]
n-gpu-layers = 999
flash-attn = on
batch-size = 1024
ubatch-size = 512
threads = 4
threads-batch = 4
parallel = 1
cache-ram = 8192
cache-reuse = 256
ctx-checkpoints = 8
fit = off
repeat-penalty = 1.0
chat-template-kwargs = {"preserve_thinking": false, "reasoning_effort": "low"}

; Default profile: dense 27B IQ3_S + MTP draft head, 48K, q8_0 KV.
; Measured: ~14400 MiB, gen ~62 tok/s, draft acceptance ~0.75.
[iq3s-mtp]
model = /models/Qwen3.8-27B-UD-IQ3_S.gguf
ctx-size = 49152
cache-type-k = q8_0
cache-type-v = q8_0
spec-type = draft-mtp,ngram-mod
model-draft = /models/mtp-Qwen3.8-27B-Q4_0.gguf
gpu-layers-draft = 99
spec-draft-n-max = 2

; Quality option: larger Q3_K_XL quant, 32K, no MTP.
; Measured: ~13340 MiB, gen ~29 tok/s.
[q3kxl]
model = /models/Qwen3.8-27B-UD-Q3_K_XL.gguf
ctx-size = 32768
cache-type-k = q8_0
cache-type-v = q8_0
spec-type = ngram-mod

; Long context: IQ3_S, 128K, q4_0 KV, no MTP.
; Measured: ~13984 MiB, gen ~30 tok/s.
[longctx]
model = /models/Qwen3.8-27B-UD-IQ3_S.gguf
ctx-size = 131072
cache-type-k = q4_0
cache-type-v = q4_0
spec-type = ngram-mod

; A/B baseline for the tuning experiment only: old cache settings, MTP only.
; Route benchmark requests here to compare with the tuned iq3s-mtp preset.
[iq3s-mtp-base]
model = /models/Qwen3.8-27B-UD-IQ3_S.gguf
ctx-size = 49152
cache-type-k = q8_0
cache-type-v = q8_0
cache-ram = 4096
ctx-checkpoints = 4
spec-type = draft-mtp
model-draft = /models/mtp-Qwen3.8-27B-Q4_0.gguf
gpu-layers-draft = 99
spec-draft-n-max = 2

; Inkling-2-Mini UD-Q4_K_M — MoE, experts in host RAM, 128K q4_0 KV.
; Uses Mainline_Support layout (root GGUF is not mainline-compatible).
[inkling2-mini]
model = /models/Inkling-2-Mini-UD-Q4_K_M.gguf
alias = inkling2-mini
ctx-size = 131072
n-gpu-layers = 999
flash-attn = on
batch-size = 256
ubatch-size = 256
threads = 4
threads-batch = 4
parallel = 1
load-mode = mlock
cache-type-k = q4_0
cache-type-v = q4_0
cache-ram = 4096
ctx-checkpoints = 8
temp = 1.0
top-p = 1.0
top-k = 0
min-p = 0.0
repeat-penalty = 1.0
spec-type = none
cpu-moe = true
moe-cache-mib = 4096
moe-cache-cpu-share = 0.0
chat-template-kwargs = {"preserve_thinking": false, "reasoning_effort": "low"}
