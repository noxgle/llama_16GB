; PRIMARY: only non-looped layers' experts in CPU via -ot; mmap not mlock.
; Measured: 30 tok/s gen, 69 tok/s prefill (8K prompt), 14.9 GiB VRAM.
[inkling2-mini]
model = /models/Inkling-2-Mini-UD-Q4_K_M.gguf
alias = inkling2-mini
ctx-size = 131072
n-gpu-layers = 999
load-mode = none
flash-attn = on
batch-size = 1024
ubatch-size = 32
threads = 4
threads-batch = 4
parallel = 1
cache-type-k = q8_0
cache-type-v = q8_0
cache-ram = 4096
ctx-checkpoints = 8
temp = 1.0
top-p = 1.0
top-k = 0
min-p = 0.0
