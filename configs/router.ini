; ═══════════════════════════════════════════════════════════════════
; ROUTER MODE PRESETS (experimental) — llama.cpp b12811
;
; Used with `llama-server --models-preset /router.ini` and NO -m flag.
; Start with --models-max 1 --models-memory-margin 512: the 16 GB card
; fits only one of these models at a time; the router unloads the LRU
; instance before loading another. See README → Router mode.
;
; Keys are CLI options without the leading dashes. Precedence:
; router CLI args > model-specific section > [*] global section.
; ═══════════════════════════════════════════════════════════════════

version = 1

[*]
n-gpu-layers = 999
flash-attn = on
batch-size = 1024
ubatch-size = 512
threads = 4
threads-batch = 4
parallel = 1
cache-ram = 8192
cache-reuse = 256
ctx-checkpoints = 8
fit = off
repeat-penalty = 1.0
chat-template-kwargs = {"preserve_thinking": false, "reasoning_effort": "low"}

; Default profile: dense 27B IQ3_S + MTP draft head, 48K, q8_0 KV.
; Measured: ~14400 MiB, gen ~62 tok/s, draft acceptance ~0.75.
[iq3s-mtp]
model = /models/Qwen3.8-27B-UD-IQ3_S.gguf
ctx-size = 49152
cache-type-k = q8_0
cache-type-v = q8_0
spec-type = draft-mtp,ngram-mod
model-draft = /models/mtp-Qwen3.8-27B-Q4_0.gguf
gpu-layers-draft = 99
spec-draft-n-max = 2

; Quality option: larger Q3_K_XL quant, 32K, no MTP.
; Measured: ~13340 MiB, gen ~29 tok/s.
[q3kxl]
model = /models/Qwen3.8-27B-UD-Q3_K_XL.gguf
ctx-size = 32768
cache-type-k = q8_0
cache-type-v = q8_0
spec-type = ngram-mod

; Long context: IQ3_S, 128K, q4_0 KV, no MTP.
; Measured: ~13984 MiB, gen ~30 tok/s.
[longctx]
model = /models/Qwen3.8-27B-UD-IQ3_S.gguf
ctx-size = 131072
cache-type-k = q4_0
cache-type-v = q4_0
spec-type = ngram-mod

; Optional DSpark preset (n_max=3): ~41 tok/s on repeated text, no prefill cost,
; +1,2 GiB VRAM. Requires the 481 MB mainline drafter GGUF.
[inkling2-mini-dspark]
model = /models/Inkling-2-Mini-UD-Q4_K_M.gguf
alias = inkling2-mini-dspark
model-draft = /models/dspark-Inkling-2-Mini-Q8_0.gguf
ctx-size = 131072
n-gpu-layers = 999
gpu-layers-draft = 99
load-mode = none
flash-attn = on
batch-size = 1024
ubatch-size = 32
threads = 4
threads-batch = 4
parallel = 1
cache-type-k = q8_0
cache-type-v = q8_0
cache-ram = 4096
ctx-checkpoints = 8
temp = 1.0
top-p = 1.0
top-k = 0
min-p = 0.0
repeat-penalty = 1.0
spec-type = draft-dspark
spec-draft-n-max = 3
override-tensor = blk\.(0|1|2|3|20|21|22|23)\.ffn_.*_exps.*=CPU
moe-cache-mib = 1536
moe-cache-cpu-share = 0.0
reasoning-budget-message =  thinking budget exceeded, answer now.
chat-template-kwargs = {"preserve_thinking": false, "reasoning_effort": "low"}

; Balanced: 128K q8_0, ubatch 128 with 1,5 GiB expert cache (138 tok/s prefill).
[inkling2-mini-balanced]
model = /models/Inkling-2-Mini-UD-Q4_K_M.gguf
alias = inkling2-mini-balanced
ctx-size = 131072
n-gpu-layers = 999
load-mode = none
flash-attn = on
batch-size = 1024
ubatch-size = 128
threads = 4
threads-batch = 4
parallel = 1
cache-type-k = q8_0
cache-type-v = q8_0
cache-ram = 4096
ctx-checkpoints = 8
temp = 1.0
top-p = 1.0
top-k = 0
min-p = 0.0
repeat-penalty = 1.0
spec-type = none
override-tensor = blk\.(0|1|2|3|20|21|22|23)\.ffn_.*_exps.*=CPU
moe-cache-mib = 1536
moe-cache-cpu-share = 0.0
reasoning-budget-message =  thinking budget exceeded, answer now.
chat-template-kwargs = {"preserve_thinking": false, "reasoning_effort": "low"}

; PRIMARY: 128K + q8_0 KV, ubatch 256, no MoE cache.
; Measured: 249-255 tok/s prefill, gen 29-32, VRAM ~13.4 GiB.
[inkling2-mini]
model = /models/Inkling-2-Mini-UD-Q4_K_M.gguf
alias = inkling2-mini
ctx-size = 131072
n-gpu-layers = 999
load-mode = none
flash-attn = on
batch-size = 1024
ubatch-size = 256
threads = 4
threads-batch = 4
parallel = 1
cache-type-k = q8_0
cache-type-v = q8_0
cache-ram = 4096
ctx-checkpoints = 8
temp = 1.0
top-p = 1.0
top-k = 0
min-p = 0.0
repeat-penalty = 1.0
spec-type = none
override-tensor = blk\.(0|1|2|3|20|21|22|23)\.ffn_.*_exps.*=CPU
moe-cache-mib = 0
moe-cache-cpu-share = 0.0
reasoning-budget-message =  thinking budget exceeded, answer now.
chat-template-kwargs = {"preserve_thinking": false, "reasoning_effort": "low"}
