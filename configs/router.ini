temp = 1.0
top-p = 1.0
top-k = 0
min-p = 0.0
repeat-penalty = 1.0
spec-type = none
cpu-moe = true
moe-cache-mib = 8192
moe-cache-cpu-share = 0.0
chat-template-kwargs = {"preserve_thinking": false, "reasoning_effort": "low"}

